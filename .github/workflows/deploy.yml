# =============================================================================
# CI/CD Pipeline: Auto-deploy Next.js app to cPanel shared hosting
# =============================================================================
# Trigger: Runs on every push to 'main' branch, or manually via GitHub UI
# Flow:    Checkout → Install → Build → Upload via SSH → Restart server
# =============================================================================

name: Deploy to cPanel

on:
  push:
    branches: [main]     # Auto-deploy when code is pushed/merged to main
  workflow_dispatch:     # Allow manual trigger from GitHub Actions tab

concurrency:
  group: cpanel-deploy-main
  cancel-in-progress: true

env:
  NODE_VERSION: '24'     # Must match your local & cPanel Node.js version

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:

      # -----------------------------------------------------------------------
      # STEP 1: Pull the latest code from the repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # -----------------------------------------------------------------------
      # STEP 2: Install Node.js with npm caching for faster builds
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'   # Caches node_modules between runs for speed

      # -----------------------------------------------------------------------
      # STEP 3: Install all dependencies using the lockfile (clean install)
      # 'npm ci' is faster & stricter than 'npm install' for CI environments
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # -----------------------------------------------------------------------
      # STEP 4: Create .env and .env.local files from GitHub Secrets
      # These files are NOT in the repo (gitignored), so we recreate them
      # here for the build process. They also get deployed to the server.
      # -----------------------------------------------------------------------
      - name: Create environment files
        run: |
          cat > .env << 'ENVEOF'
          BASE_URL=${{ secrets.BASE_URL }}
          NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          AUTH_REDIRECT_URL=${{ secrets.AUTH_REDIRECT_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_SECRECT=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_SECRECT }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRECT=${{ secrets.GOOGLE_CLIENT_SECRECT }}
          GOOGLE_CLIENT_EMAIL=${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY=${{ secrets.GOOGLE_PRIVATE_KEY }}
          GA4_PROPERTY_ID=${{ secrets.GA4_PROPERTY_ID }}
          MEASUREMENT_ID=${{ secrets.MEASUREMENT_ID }}
          SEARCH_CONSOLE_SITE_URL=${{ secrets.SEARCH_CONSOLE_SITE_URL }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          CONTACT_RECEIVER_EMAIL=${{ secrets.CONTACT_RECEIVER_EMAIL }}
          CHECKPOINT_DISABLE=1
          ENVEOF

          grep -Eq '^DATABASE_URL=.+$' .env || {
            echo "DATABASE_URL GitHub secret is missing or empty."
            exit 1
          }

          node - << 'NODE'
          const fs = require('fs');
          const env = fs.readFileSync('.env', 'utf8');
          const match = env.match(/^DATABASE_URL=(.*)$/m);
          const value = match?.[1]?.trim().replace(/^["']|["']$/g, '');

          if (!value) {
            console.error('DATABASE_URL GitHub secret is missing or empty.');
            process.exit(1);
          }

          const url = new URL(value);
          if (!/^postgres(ql)?:$/.test(url.protocol)) {
            console.error('DATABASE_URL must be a PostgreSQL connection string.');
            process.exit(1);
          }

          if (['localhost', '127.0.0.1', '::1'].includes(url.hostname)) {
            console.error('DATABASE_URL points to localhost, which will fail on cPanel unless PostgreSQL runs there.');
            process.exit(1);
          }

          console.log(`DATABASE_URL target: ${url.hostname}:${url.port || '5432'}`);
          NODE

          cat > .env.local << 'ENVLOCALEOF'
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          CHAT_GPT_API_KEY=${{ secrets.CHAT_GPT_API_KEY }}
          CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}
          OPEN_ROUTER_API_KEY=${{ secrets.OPEN_ROUTER_API_KEY }}
          KILO_CODE_API_KEY=${{ secrets.KILO_CODE_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          ENVLOCALEOF

      # -----------------------------------------------------------------------
      # STEP 5: Generate Prisma ORM client from your schema
      # This creates the database query engine used by your app
      # -----------------------------------------------------------------------
      - name: Generate Prisma client
        run: npx prisma generate

      # -----------------------------------------------------------------------
      # STEP 6: Restore Next.js build cache
      # Reuses incremental build artifacts to speed up subsequent deploy builds.
      # -----------------------------------------------------------------------
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-cache-${{ hashFiles('package-lock.json', 'package.json', 'next.config.mjs', 'app/**', 'actions/**', 'components/**', 'context/**', 'lib/**', 'queries/**') }}
          restore-keys: |
            ${{ runner.os }}-next-cache-

      # -----------------------------------------------------------------------
      # STEP 7: Build the Next.js production bundle
      # Output goes to .next/ folder with optimized pages & assets
      # -----------------------------------------------------------------------
      - name: Build application
        run: npm run build

      # -----------------------------------------------------------------------
      # STEP 8: Prepare a clean deployment package (standalone mode)
      # Next.js 'standalone' output bundles ALL dependencies into the build.
      # No need for 'npm install' on the server — everything is included!
      # Structure: .next/standalone/ contains server.js + node_modules
      #            .next/static/ contains CSS, JS, images (must be copied in)
      # -----------------------------------------------------------------------
      - name: Prepare deployment files
        run: |
          rm -rf deploy
          mkdir -p deploy

          # The standalone build includes symlinks for some external packages.
          # Dereference them because cPanel uploads can leave broken links.
          cp -RL .next/standalone/. deploy/

          # Static assets (CSS, JS bundles) — must be placed inside .next/static/
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/

          # Public folder (images, fonts, etc.)
          cp -r public deploy/public

          # Environment files
          [ -f .env ] && cp .env deploy/.env
          [ -f .env.local ] && cp .env.local deploy/.env.local

          # Copy prisma schema (needed at runtime)
          cp -r prisma deploy/prisma

          # Prisma is externalized by Next.js and must be present in standalone output.
          test -d deploy/node_modules/@prisma/client
          test -d deploy/.next/node_modules/@prisma
          test -d deploy/.next/node_modules/@prisma/client-*

          if find deploy -type l | grep -q .; then
            echo "Deployment package contains symlinks; refusing to upload to cPanel."
            find deploy -type l -print
            exit 1
          fi

          # Create the Passenger restart marker inside the same payload so the
          # restart happens once after the upload finishes.
          mkdir -p deploy/tmp
          touch deploy/tmp/restart.txt

      # -----------------------------------------------------------------------
      # STEP 9: Stop stale Node/Next.js processes on the server before deploy
      # Some cPanel/Passenger setups leave old next-server processes running
      # after a restart, which causes multiple instances to accumulate.
      # -----------------------------------------------------------------------
      - name: Stop stale Next.js processes on server
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          SSH_KEY_B64: ${{ secrets.CPANEL_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail

          if [ -n "${SSH_HOST:-}" ] && [ -n "${SSH_USER:-}" ] && [ -n "${SSH_PORT:-}" ] && [ -n "${SSH_KEY_B64:-}" ]; then
            mkdir -p ~/.ssh
            SSH_KEY_FILE=~/.ssh/cpanel_deploy_key
            printf '%s' "${SSH_KEY_B64}" | tr -d '\r\n ' | base64 -d > "${SSH_KEY_FILE}"
            chmod 600 "${SSH_KEY_FILE}"

            if ! ssh-keygen -y -f "${SSH_KEY_FILE}" >/dev/null 2>&1; then
              echo "SSH key file is invalid after reconstruction. Use CPANEL_SSH_PRIVATE_KEY_B64 or re-paste the full private key exactly."
              exit 1
            fi

            ssh -p "${SSH_PORT}" -i "${SSH_KEY_FILE}" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SSH_USER}@${SSH_HOST}" '
              echo "SSH connection OK"
              whoami
              hostname
              echo "Existing Next.js processes:"
              current_shell_pid=$$
              pgrep -af "next-server|node .*server.js" || true
              for pid in $(pgrep -f "next-server" || true); do
                if [ "${pid}" != "${current_shell_pid}" ]; then
                  kill "${pid}" || true
                fi
              done
              for pid in $(pgrep -f "node .*server.js" || true); do
                if [ "${pid}" != "${current_shell_pid}" ]; then
                  kill "${pid}" || true
                fi
              done
            '

            rm -f "${SSH_KEY_FILE}"
            echo "Stale Next.js processes cleanup attempted."
          else
            echo "SSH cleanup skipped: CPANEL_SSH_HOST/USER/PORT/PRIVATE_KEY_B64 secrets not configured."
          fi

      # -----------------------------------------------------------------------
      # STEP 10: Deploy to cPanel via SSH
      # Uses a tar stream over SSH for fast deployment without extra runner dependencies
      # -----------------------------------------------------------------------
      # Required GitHub Secrets:
      #   CPANEL_SSH_HOST      - SSH server hostname (same as cPanel host or IP)
      #   CPANEL_SSH_USER      - SSH username (usually same as cPanel username)
      #   CPANEL_SSH_PORT      - SSH port (e.g. 1157)
      #   CPANEL_SSH_PRIVATE_KEY_B64 - Base64-encoded private key for SSH access
      #   CPANEL_APP_PATH      - Remote directory (e.g. /home/sphinixx/sphinix-mobile)
      # -----------------------------------------------------------------------
      - name: Deploy to cPanel via SSH
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          SSH_KEY_B64: ${{ secrets.CPANEL_SSH_PRIVATE_KEY_B64 }}
          APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        run: |
          set -euo pipefail

          : "${SSH_HOST:?CPANEL_SSH_HOST secret is required}"
          : "${SSH_USER:?CPANEL_SSH_USER secret is required}"
          : "${SSH_PORT:?CPANEL_SSH_PORT secret is required}"
          : "${SSH_KEY_B64:?CPANEL_SSH_PRIVATE_KEY_B64 secret is required}"
          : "${APP_PATH:?CPANEL_APP_PATH secret is required}"

          mkdir -p ~/.ssh
          SSH_KEY_FILE=~/.ssh/cpanel_deploy_key
          printf '%s' "${SSH_KEY_B64}" | tr -d '\r\n ' | base64 -d > "${SSH_KEY_FILE}"
          chmod 600 "${SSH_KEY_FILE}"

          if ! ssh-keygen -y -f "${SSH_KEY_FILE}" >/dev/null 2>&1; then
            echo "SSH key file is invalid after reconstruction."
            exit 1
          fi

          tar -czf - -C deploy . \
            | ssh -p "${SSH_PORT}" -i "${SSH_KEY_FILE}" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SSH_USER}@${SSH_HOST}" "mkdir -p '${APP_PATH}' && find '${APP_PATH}' -mindepth 1 -maxdepth 1 -exec rm -rf {} + && tar -xzf - -C '${APP_PATH}'"

          rm -f "${SSH_KEY_FILE}"
          echo "SSH deployment complete!"
