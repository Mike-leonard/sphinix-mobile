# =============================================================================
# CI/CD Pipeline: Auto-deploy Next.js app to cPanel shared hosting
# =============================================================================
# Trigger: Runs on every push to 'main' branch, or manually via GitHub UI
# Flow:    Checkout → Install → Build → Upload via SSH → Restart server
# =============================================================================

name: Deploy to cPanel

on:
  push:
    branches: [main]     # Auto-deploy when code is pushed/merged to main
  workflow_dispatch:     # Allow manual trigger from GitHub Actions tab

env:
  NODE_VERSION: '24'     # Must match your local & cPanel Node.js version

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:

      # -----------------------------------------------------------------------
      # STEP 1: Pull the latest code from the repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # -----------------------------------------------------------------------
      # STEP 2: Install Node.js with npm caching for faster builds
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'   # Caches node_modules between runs for speed

      # -----------------------------------------------------------------------
      # STEP 3: Install all dependencies using the lockfile (clean install)
      # 'npm ci' is faster & stricter than 'npm install' for CI environments
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # STEP 4: Create .env and .env.local files from GitHub Secrets
      # These files are NOT in the repo (gitignored), so we recreate them
      # here for the build process. They also get deployed to the server.
      # -----------------------------------------------------------------------
      - name: Create environment files
        run: |
          cat > .env << 'ENVEOF'
          BASE_URL=${{ secrets.BASE_URL }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          AUTH_REDIRECT_URL=${{ secrets.AUTH_REDIRECT_URL }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_SECRET=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_SECRET }}
          GOOGLE_CLIENT_EMAIL=${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY=${{ secrets.GOOGLE_PRIVATE_KEY }}
          GA4_PROPERTY_ID=${{ secrets.GA4_PROPERTY_ID }}
          SEARCH_CONSOLE_SITE_URL=${{ secrets.SEARCH_CONSOLE_SITE_URL }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          CONTACT_RECEIVER_EMAIL=${{ secrets.CONTACT_RECEIVER_EMAIL }}
          ENVEOF

          cat > .env.local << 'ENVLOCALEOF'
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          CHAT_GPT_API_KEY=${{ secrets.CHAT_GPT_API_KEY }}
          CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}
          OPEN_ROUTER_API_KEY=${{ secrets.OPEN_ROUTER_API_KEY }}
          KILO_CODE_API_KEY=${{ secrets.KILO_CODE_API_KEY }}
          OLLAMA_API_KEY=${{ secrets.OLLAMA_API_KEY }}
          SUPA_BASE_PASS=${{ secrets.SUPA_BASE_PASS }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          ENVLOCALEOF

      # -----------------------------------------------------------------------
      # STEP 5: Generate Prisma ORM client from your schema
      # This creates the database query engine used by your app
      # -----------------------------------------------------------------------
      - name: Generate Prisma client
        run: npx prisma generate

      # -----------------------------------------------------------------------
      # STEP 6: Build the Next.js production bundle
      # Output goes to .next/ folder with optimized pages & assets
      # -----------------------------------------------------------------------
      - name: Build application
        run: npm run build

      # -----------------------------------------------------------------------
      # STEP 7: Prepare a clean deployment package
      # Only includes files the server needs to run — no source code,
      # no tests, no dev tools. Also removes .next/ build cache/traces
      # to reduce upload size.
      # -----------------------------------------------------------------------
      - name: Prepare deployment files
        run: |
          mkdir -p deploy

          # Production-required files
          cp -r .next deploy/.next
          cp -r public deploy/public
          cp -r prisma deploy/prisma
          cp package.json deploy/package.json
          cp package-lock.json deploy/package-lock.json
          cp next.config.mjs deploy/next.config.mjs

          # Startup file for cPanel's Node.js App (Phusion Passenger)
          [ -f server.js ] && cp server.js deploy/server.js

          # Environment files (created in Step 4)
          [ -f .env ] && cp .env deploy/.env
          [ -f .env.local ] && cp .env.local deploy/.env.local

          # Remove dev-only .next subdirectories to save upload bandwidth
          rm -rf deploy/.next/cache
          rm -rf deploy/.next/dev
          rm -rf deploy/.next/diagnostics
          rm -rf deploy/.next/node_modules
          rm -rf deploy/.next/types
          rm -rf deploy/.next/trace
          rm -rf deploy/.next/trace-build
          rm -rf deploy/.next/turbopack

      # -----------------------------------------------------------------------
      # STEP 8: Deploy to cPanel via FTP
      # Uses lftp for reliable FTP upload with mirroring (only uploads changes)
      # FTP works on all cPanel shared hosting without firewall issues
      # -----------------------------------------------------------------------
      # Required GitHub Secrets:
      #   CPANEL_FTP_HOST      - FTP server (same as domain or server IP)
      #   CPANEL_FTP_USER      - FTP username (usually same as cPanel username)
      #   CPANEL_FTP_PASSWORD   - FTP password (usually same as cPanel password)
      #   CPANEL_APP_PATH      - Remote directory (e.g. /home/sphinixx/sphinix-mobile)
      # -----------------------------------------------------------------------
      - name: Deploy to cPanel via FTP
        run: |
          sudo apt-get install -y lftp > /dev/null 2>&1

          lftp -e "
            set ssl:verify-certificate no;
            set ftp:ssl-allow yes;
            set net:timeout 30;
            set net:max-retries 3;
            set mirror:parallel-transfer-count 5;
            open -u ${{ secrets.CPANEL_FTP_USER }},${{ secrets.CPANEL_FTP_PASSWORD }} ${{ secrets.CPANEL_FTP_HOST }};
            mirror --reverse --delete --verbose --exclude node_modules/ deploy/ ${{ secrets.CPANEL_APP_PATH }}/;
            bye;
          "
          echo "FTP deployment complete!"

